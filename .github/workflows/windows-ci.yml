name: Windows CI

on:
  push:
    branches:
      - v0.1.0-dev1
      - work/runtime-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Windows runtime
        run: dotnet restore src/WindowsImeCaretIndicator/WindowsImeCaretIndicator.csproj -r win-x64

      - name: Build debug runtime
        run: dotnet build src/WindowsImeCaretIndicator/WindowsImeCaretIndicator.csproj -c Debug --no-restore

      - name: Publish v0.1.1 single-file candidate
        run: dotnet publish src/WindowsImeCaretIndicator/WindowsImeCaretIndicator.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -o artifacts/win-x64

      - name: Restore and build WebView2 caret test host
        shell: pwsh
        run: |
          dotnet restore tests/WebView2CaretHost/WebView2CaretHost.csproj
          dotnet build tests/WebView2CaretHost/WebView2CaretHost.csproj -c Release --no-restore

      - name: Prepare pinned Electron runtime
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        shell: pwsh
        run: |
          $version = "44.4.3"
          $zip = "artifacts/electron-v$version-win32-x64.zip"
          $dir = "artifacts/electron"
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/electron/electron/releases/download/v$version/electron-v$version-win32-x64.zip" -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "790a355b684d5c7cc8dc3cdd8c4cca7c4b2d054685427c7554a956879a82e70b") {
            throw "Pinned Electron runtime checksum mismatch: $hash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $electronExe = Join-Path $dir "electron.exe"
          if (-not (Test-Path -LiteralPath $electronExe)) {
            throw "Pinned Electron archive did not contain electron.exe."
          }
          Write-Host "Validated pinned Electron v$version archive with SHA256 $hash"

      - name: Install VS Code Electron target
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        shell: pwsh
        run: choco install vscode -y --no-progress

      - name: Run deterministic self tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src/WindowsImeCaretIndicator/bin/Debug" -Recurse -Filter "WindowsImeCaretIndicator.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Debug executable was not produced."
          }
          & $exe.FullName --self-test
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Chrome and Edge caret smoke tests
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        id: browser_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/win-x64/WindowsImeCaretIndicator.exe"
          ./tests/browser-caret-smoke.ps1 -ExecutablePath $exe.Path

      - name: Prepare Korean input profile
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        id: korean_profile
        continue-on-error: true
        shell: pwsh
        run: |
          $languages = Get-WinUserLanguageList
          if (-not ($languages.LanguageTag -contains "ko-KR")) {
            $languages.Add("ko-KR")
            Set-WinUserLanguageList $languages -Force
          }

          $languages = Get-WinUserLanguageList
          $korean = $languages | Where-Object { $_.LanguageTag -in @("ko-KR", "ko") } | Select-Object -First 1
          $koreanTip = $korean.InputMethodTips | Where-Object { $_ -like "0412:*" } | Select-Object -First 1
          if (-not $koreanTip) {
            throw "Korean Microsoft IME input TIP was not registered."
          }

          Set-WinDefaultInputMethodOverride -InputTip $koreanTip
          Start-Process -FilePath "$env:WINDIR\System32\ctfmon.exe" -ErrorAction SilentlyContinue

          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Write-Host "Default Korean input TIP: $koreanTip"

      - name: Korean IME actual-input smoke test
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        id: korean_ime_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/win-x64/WindowsImeCaretIndicator.exe"
          ./tests/korean-ime-smoke.ps1 -ExecutablePath $exe.Path

      - name: Download immutable v0.1.0 portable for runtime validation
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        shell: pwsh
        run: |
          $dir = "artifacts/released-v0.1.0"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $path = Join-Path $dir "WindowsImeCaretIndicator.exe"
          Invoke-WebRequest -Uri "https://github.com/shaterguy/windows-ime-caret-indicator/releases/download/v0.1.0/WindowsImeCaretIndicator.exe" -OutFile $path
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "35981ffa5c433dad472f91c5ee7752429cdcdf17f097a291608bdd103955d202") {
            throw "Immutable v0.1.0 portable checksum mismatch: $hash"
          }
          Write-Host "Validated immutable v0.1.0 portable: $hash"

      - name: Actual ChatGPT composer caret diagnostic on v0.1.1 candidate
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        id: chatgpt_actual
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/win-x64/WindowsImeCaretIndicator.exe"
          ./tests/chatgpt-caret-smoke.ps1 -ExecutablePath $exe.Path

      - name: Upload ChatGPT caret evidence
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        uses: actions/upload-artifact@v4
        with:
          name: WICI-chatgpt-caret-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/chatgpt-caret.json
          if-no-files-found: error

      - name: Discover mandatory Windows target environments against v0.1.1 candidate
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/win-x64/WindowsImeCaretIndicator.exe"
          ./tests/windows-target-discovery.ps1 -ExecutablePath $exe.Path

      - name: Upload Windows target discovery evidence
        if: ${{ always() && !startsWith(github.event.head_commit.message, 'security:') }}
        uses: actions/upload-artifact@v4
        with:
          name: WICI-target-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-target-discovery.json
          if-no-files-found: warn

      - name: Measure cross-integrity access to an elevated caret target
        continue-on-error: ${{ startsWith(github.event.head_commit.message, 'security:') }}
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/win-x64/WindowsImeCaretIndicator.exe"
          $webView2Host = Get-ChildItem "tests/WebView2CaretHost/bin/Release" -Recurse -Filter "WebView2CaretHost.exe" | Select-Object -First 1
          if (-not $webView2Host) {
            throw "WebView2 caret test host executable was not produced."
          }
          ./tests/cross-integrity-smoke.ps1 -ExecutablePath $exe.Path -WebView2HostPath $webView2Host.FullName

      - name: Upload cross-integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WICI-cross-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cross-integrity.json
          if-no-files-found: error

      - name: Validate v0.1.1 candidate overlay runtime quality
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/win-x64/WindowsImeCaretIndicator.exe"
          ./tests/runtime-quality-smoke.ps1 -ExecutablePath $exe.Path

      - name: Upload released runtime-quality evidence
        if: ${{ !startsWith(github.event.head_commit.message, 'security:') }}
        uses: actions/upload-artifact@v4
        with:
          name: WICI-runtime-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/runtime-quality.json
            artifacts/runtime-quality-overlay.png
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          ISCC.exe /DMyAppVersion=0.1.1 installer/WindowsImeCaretIndicator.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install and uninstall smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem "artifacts/installer" -Filter "WindowsImeCaretIndicator-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not produced."
          }

          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Silent installer failed with exit code $($installProcess.ExitCode)."
          }

          $installDir = Join-Path $env:ProgramFiles "Windows IME Caret Indicator"
          $installedExe = Join-Path $installDir "WindowsImeCaretIndicator.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Protected installed executable was not found."
          }

          $programFilesRoot = [IO.Path]::GetFullPath($env:ProgramFiles).TrimEnd('\') + '\'
          $installedFullPath = [IO.Path]::GetFullPath($installedExe)
          if (-not $installedFullPath.StartsWith(
                  $programFilesRoot,
                  [StringComparison]::OrdinalIgnoreCase)) {
            throw "Installed executable is not under Program Files."
          }

          $writeMask = (
              [System.Security.AccessControl.FileSystemRights]::WriteData -bor
              [System.Security.AccessControl.FileSystemRights]::AppendData -bor
              [System.Security.AccessControl.FileSystemRights]::WriteExtendedAttributes -bor
              [System.Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles -bor
              [System.Security.AccessControl.FileSystemRights]::WriteAttributes -bor
              [System.Security.AccessControl.FileSystemRights]::Delete -bor
              [System.Security.AccessControl.FileSystemRights]::ChangePermissions -bor
              [System.Security.AccessControl.FileSystemRights]::TakeOwnership)
          $untrustedSids = @(
              "S-1-1-0",
              "S-1-5-11",
              "S-1-5-32-545")
          $unsafeAce = (Get-Acl -LiteralPath $installDir).Access |
              Where-Object {
                  if ($_.AccessControlType -ne
                      [System.Security.AccessControl.AccessControlType]::Allow) {
                      return $false
                  }

                  try {
                      $sid = $_.IdentityReference.Translate(
                          [System.Security.Principal.SecurityIdentifier]).Value
                  }
                  catch {
                      return $false
                  }

                  return $sid -in $untrustedSids -and
                      (($_.FileSystemRights -band $writeMask) -ne 0)
              } |
              Select-Object -First 1
          if ($null -ne $unsafeAce) {
            throw "Program Files install directory grants write-capable access to an untrusted principal: $unsafeAce"
          }

          $selfTestProcess = Start-Process -FilePath $installedExe -ArgumentList "--self-test" -Wait -PassThru
          if ($selfTestProcess.ExitCode -ne 0) {
            throw "Installed protected executable self-test failed with exit code $($selfTestProcess.ExitCode)."
          }

          $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            throw "Uninstaller was not found."
          }

          $uninstallProcess = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Silent uninstall failed with exit code $($uninstallProcess.ExitCode)."
          }

          if (Test-Path $installedExe) {
            throw "Installed executable remains after uninstall."
          }

      - name: Upload distribution files
        uses: actions/upload-artifact@v4
        with:
          name: WindowsImeCaretIndicator-win-x64
          path: |
            artifacts/win-x64/WindowsImeCaretIndicator.exe
            artifacts/installer/WindowsImeCaretIndicator-Setup-*.exe
          if-no-files-found: error

      - name: Enforce runtime smoke results
        if: steps.browser_smoke.outcome == 'failure' || steps.korean_profile.outcome == 'failure' || steps.korean_ime_smoke.outcome == 'failure' || steps.chatgpt_actual.outcome == 'failure'
        shell: pwsh
        run: |
          throw "One or more runtime smoke tests failed earlier in this job."
