name: Windows CI

on:
  push:
    branches:
      - v0.1.0-dev1
      - work/runtime-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Windows runtime
        run: dotnet restore src/WindowsImeCaretIndicator/WindowsImeCaretIndicator.csproj -r win-x64

      - name: Build debug runtime
        run: dotnet build src/WindowsImeCaretIndicator/WindowsImeCaretIndicator.csproj -c Debug --no-restore

      - name: Run deterministic self tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src/WindowsImeCaretIndicator/bin/Debug" -Recurse -Filter "WindowsImeCaretIndicator.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Debug executable was not produced."
          }
          & $exe.FullName --self-test
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Chrome and Edge caret smoke tests
        id: browser_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src/WindowsImeCaretIndicator/bin/Debug" -Recurse -Filter "WindowsImeCaretIndicator.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Debug executable was not produced."
          }
          ./tests/browser-caret-smoke.ps1 -ExecutablePath $exe.FullName

      - name: Prepare Korean input profile
        id: korean_profile
        continue-on-error: true
        shell: pwsh
        run: |
          $languages = Get-WinUserLanguageList
          if (-not ($languages.LanguageTag -contains "ko-KR")) {
            $languages.Add("ko-KR")
            Set-WinUserLanguageList $languages -Force
          }

          $languages = Get-WinUserLanguageList
          $korean = $languages | Where-Object { $_.LanguageTag -in @("ko-KR", "ko") } | Select-Object -First 1
          $koreanTip = $korean.InputMethodTips | Where-Object { $_ -like "0412:*" } | Select-Object -First 1
          if (-not $koreanTip) {
            throw "Korean Microsoft IME input TIP was not registered."
          }

          Set-WinDefaultInputMethodOverride -InputTip $koreanTip
          Start-Process -FilePath "$env:WINDIR\System32\ctfmon.exe" -ErrorAction SilentlyContinue

          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Write-Host "Default Korean input TIP: $koreanTip"

      - name: Korean IME actual-input smoke test
        id: korean_ime_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src/WindowsImeCaretIndicator/bin/Debug" -Recurse -Filter "WindowsImeCaretIndicator.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Debug executable was not produced."
          }
          ./tests/korean-ime-smoke.ps1 -ExecutablePath $exe.FullName

      - name: Publish Windows x64 self-contained
        run: dotnet publish src/WindowsImeCaretIndicator/WindowsImeCaretIndicator.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -o artifacts/win-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          ISCC.exe /DMyAppVersion=0.1.0-dev1 installer/WindowsImeCaretIndicator.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install and uninstall smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem "artifacts/installer" -Filter "WindowsImeCaretIndicator-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not produced."
          }

          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Silent installer failed with exit code $($installProcess.ExitCode)."
          }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\Windows IME Caret Indicator"
          $installedExe = Join-Path $installDir "WindowsImeCaretIndicator.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installed executable was not found."
          }

          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $runValue = (Get-ItemProperty -Path $runKey -Name "WindowsImeCaretIndicator" -ErrorAction Stop).WindowsImeCaretIndicator
          if ($runValue -notlike "*WindowsImeCaretIndicator.exe*") {
            throw "Startup registration was not created."
          }

          $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            throw "Uninstaller was not found."
          }

          $uninstallProcess = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Silent uninstall failed with exit code $($uninstallProcess.ExitCode)."
          }

          if (Test-Path $installedExe) {
            throw "Installed executable remains after uninstall."
          }

          $remaining = Get-ItemProperty -Path $runKey -Name "WindowsImeCaretIndicator" -ErrorAction SilentlyContinue
          if ($null -ne $remaining) {
            throw "Startup registration remains after uninstall."
          }

      - name: Upload distribution files
        uses: actions/upload-artifact@v4
        with:
          name: WindowsImeCaretIndicator-win-x64
          path: |
            artifacts/win-x64/WindowsImeCaretIndicator.exe
            artifacts/installer/WindowsImeCaretIndicator-Setup-*.exe
          if-no-files-found: error

      - name: Enforce runtime smoke results
        if: steps.browser_smoke.outcome == 'failure' || steps.korean_profile.outcome == 'failure' || steps.korean_ime_smoke.outcome == 'failure'
        shell: pwsh
        run: |
          throw "One or more runtime smoke tests failed earlier in this job."
